# ARTEX Tencent TSec Benchmark image — one-command local build + run.
# Does not interfere with the production docker-compose.yml (multi-service: artex + postgres).
# Usage:
#   cp bench/.env.example bench/.env   # Fill in LLM_API_KEY / BENCHMARK_TOKEN, etc.
#   docker compose -f docker-compose.bench.yml up --build      # Build and run in foreground (see logs)
#   docker compose -f docker-compose.bench.yml up --build -d   # Run in background
#   docker compose -f docker-compose.bench.yml logs -f
#   docker compose -f docker-compose.bench.yml down            # Stop (add -v to also remove volumes)
# Browser: http://localhost:8787 (log in with ADMIN_PASSWORD)

services:
  artex-bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: artex-bench:latest
    container_name: artex-bench
    env_file:
      - bench/.env
    # Share the host network: the container uses the host's network stack directly,
    # allowing it to reach target machines on the host/VPN.
    # In host mode, no port mapping is needed; the container binds host ports directly: 8787 (UI/API), 8788 (proxy),
    # and internal PostgreSQL 5432 — ensure these three ports are free on the host (stop any services using them before testing).
    network_mode: host
    restart: "no"

volumes:
  artex_bench_data: